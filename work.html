  #pscrim{position:fixed;inset:0;background:rgba(8,8,14,.62);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    opacity:0;pointer-events:none;transition:opacity .3s ease}
  #pscrim.open{opacity:1;pointer-events:auto}
  #pwrap{perspective:1200px;position:relative}
  #phone{position:relative;height:min(80vh,800px);aspect-ratio:390/820;max-width:92vw;
    border-radius:clamp(28px,5vh,46px);padding:10px;
    --rx:0deg;--ry:0deg;
    background:linear-gradient(135deg,rgba(255,255,255,.26),rgba(255,255,255,.05) 45%,rgba(255,255,255,.16));
    border:1.5px solid rgba(255,255,255,.5);
    box-shadow:
      0 60px 140px rgba(0,0,0,.55),
      0 12px 34px rgba(0,0,0,.35),
      inset 0 2px 1px rgba(255,255,255,.55),
      inset 2px 0 1px rgba(255,255,255,.28),
      inset 0 -2px 2px rgba(30,40,70,.4),
      inset -2px 0 2px rgba(30,40,70,.22),
      inset 0 0 34px rgba(255,255,255,.07);
    transform:rotateX(var(--rx)) rotateY(var(--ry)) scale(.9) translateY(20px);
    transition:transform .35s cubic-bezier(.2,1.4,.3,1)}
  #pscrim.open #phone{transform:rotateX(var(--rx)) rotateY(var(--ry)) scale(1) translateY(0)}
  #pscrim.open #phone.tilting{transition:transform .12s ease-out}
  #phone::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:1;
    background:linear-gradient(115deg,rgba(255,255,255,.3) 0%,rgba(255,255,255,0) 28%,rgba(255,255,255,0) 68%,rgba(255,255,255,.14) 100%);
    background-size:170% 170%;
    background-position:calc(50% + var(--rypx,0px) * 4) calc(50% + var(--rxpx,0px) * -3)}
  #phone::after{content:"";position:absolute;inset:6px;border-radius:clamp(22px,4.4vh,40px);pointer-events:none;z-index:1;
    border:1px solid rgba(255,255,255,.3);
    border-bottom-color:rgba(120,140,180,.25)}
  #pfloor{position:absolute;left:50%;bottom:-34px;transform:translateX(-50%);width:72%;height:26px;
    background:radial-gradient(50% 100% at 50% 50%,rgba(0,0,0,.5),rgba(0,0,0,0) 70%);
    filter:blur(6px);pointer-events:none}
  @media(hover:none){
    #pscrim.open #phone{animation:pfloat 6s ease-in-out infinite}
    @keyframes pfloat{0%,100%{transform:rotateX(1.6deg) translateY(0) scale(1)}50%{transform:rotateX(-1.2deg) translateY(-8px) scale(1)}}
  }
  #phone iframe{width:100%;height:100%;border:0;border-radius:clamp(20px,4vh,36px);background:#000;display:block}
  #pcover{position:absolute;inset:10px;border-radius:clamp(20px,4vh,36px);background:#000 center/cover no-repeat;
    opacity:0;transition:opacity .45s ease;pointer-events:none;z-index:1}
  #pname{color:rgba(255,255,255,.85);font-weight:800;font-size:12px;letter-spacing:.22em}
  #pclose{position:absolute;top:-14px;right:-14px;width:44px;height:44px;border-radius:50%;border:1.5px solid rgba(255,255,255,.5);
    background:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff;

<div id="pscrim" role="dialog" aria-modal="true" aria-label="playable preview">
  <div id="pwrap">
    <div id="phone">
      <button id="pclose" aria-label="close">&#10005;</button>

      <div id="pcover"></div>
    </div>

  </div>
  <div id="pname"></div>
</div>
<script>
(function(){
  var scrim=document.getElementById('pscrim'), frame=document.getElementById('pframe'),
      nameEl=document.getElementById('pname');
  var pcover=document.getElementById('pcover'), phone2=document.getElementById('phone'), originEl=null;
  var noMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function open(src,name,fromEl,coverUrl){
    frame.src=src; nameEl.textContent=name||''; originEl=fromEl||null;
    if(coverUrl){ pcover.style.backgroundImage='url('+coverUrl+')'; pcover.style.transition='none'; pcover.style.opacity='1'; }
    scrim.classList.add('open'); document.body.style.overflow='hidden';
    frame.addEventListener('load',function ld(){ frame.removeEventListener('load',ld);
      setTimeout(function(){ pcover.style.transition='opacity .45s ease'; pcover.style.opacity='0'; },600); });
    if(fromEl && !noMotion){
      requestAnimationFrame(function(){
        var a=fromEl.getBoundingClientRect(), b=phone2.getBoundingClientRect();
        var dx=(a.left+a.width/2)-(b.left+b.width/2), dy=(a.top+a.height/2)-(b.top+b.height/2), s=a.width/b.width;
        phone2.style.transition='none';
        phone2.style.transform='translate('+dx+'px,'+dy+'px) scale('+s+')';
        void phone2.offsetWidth;
        phone2.style.transition='transform .55s cubic-bezier(.2,1.2,.3,1)';
        phone2.style.transform='';
        phone2.addEventListener('transitionend',function te(){
          phone2.style.transition=''; phone2.removeEventListener('transitionend',te); });
      });
    }
  }
  function close(){
    if(originEl && !noMotion){
      var a=originEl.getBoundingClientRect(), b=phone2.getBoundingClientRect();
      var dx=(a.left+a.width/2)-(b.left+b.width/2), dy=(a.top+a.height/2)-(b.top+b.height/2), s=a.width/b.width;
      phone2.style.transition='transform .35s ease-in';
      phone2.style.transform='translate('+dx+'px,'+dy+'px) scale('+s+')';
      setTimeout(finish,330);
    } else finish();
    function finish(){
      scrim.classList.remove('open'); document.body.style.overflow='';
      phone2.style.transition='none'; phone2.style.transform='';
      void phone2.offsetWidth; phone2.style.transition='';
      setTimeout(function(){ frame.src=''; pcover.style.opacity='0'; },250);
    }
  }
  document.querySelectorAll('a.tile.live').forEach(function(a){
    a.addEventListener('click',function(e){
      if(e.metaKey||e.ctrlKey||e.shiftKey) return; /* let power users open the raw build */
      e.preventDefault();
      var img=a.querySelector('.pv img');
      open(a.getAttribute('href'), a.dataset.name, a, img?img.getAttribute('src'):null);
    });
  });
  document.getElementById('pclose').addEventListener('click',close);
  /* 3D glass tilt: follows the pointer over the scrim, flattens over the phone so play stays straight */
  var phone=document.getElementById('phone');
  if(matchMedia('(hover:hover)').matches){
    scrim.addEventListener('pointermove',function(e){
      if(!scrim.classList.contains('open')) return;
      var r=phone.getBoundingClientRect();
      var overPhone = e.clientX>r.left&&e.clientX<r.right&&e.clientY>r.top&&e.clientY<r.bottom;
      var cx=r.left+r.width/2, cy=r.top+r.height/2;
      var ry=overPhone?0:Math.max(-9,Math.min(9,(e.clientX-cx)/innerWidth*26));
      var rx=overPhone?0:Math.max(-7,Math.min(7,(cy-e.clientY)/innerHeight*20));
      phone.classList.add('tilting');
      phone.style.setProperty('--rx',rx+'deg');
      phone.style.setProperty('--ry',ry+'deg');
      phone.style.setProperty('--rxpx',rx+'px'); phone.style.setProperty('--rypx',ry+'px');
    });
    scrim.addEventListener('pointerleave',function(){
      phone.style.setProperty('--rx','0deg'); phone.style.setProperty('--ry','0deg');
    });
  }
  scrim.addEventListener('click',function(e){ if(e.target===scrim) close(); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') close(); });
})();
</script>

 b.addEventListener('click',function(){var o=document.body.classList.toggle('nav-open'); b.setAttribute('aria-expanded',o);});
 document.querySelectorAll('#menu .links a').forEach(function(a){a.addEventListener('click',function(){
   document.body.classList.remove('nav-open'); b.setAttribute('aria-expanded','false');});});
})();
</script>
